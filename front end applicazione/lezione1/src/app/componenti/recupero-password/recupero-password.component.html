<form [formGroup]="recuperoPassword"  style="display: flex; flex-direction: column;">
  <mat-form-field>
    <mat-label>Password Vecchia</mat-label>
    <input   matInput formControlName="passwordVecchia">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Password Nuova</mat-label>
    <input matInput  type="password" formControlName="passwordNuova">
  </mat-form-field>

  <button (click)="cambioPassword()" class="mit" type="submit" mat-raised-button color="primary">Invia</button>

</form>
